name: 📡 Daily Internship Scanner & ntfy Alert

on:
  schedule:
    # Runs everyday around 09:00 AM IST (03:25 UTC - off-peak minute avoids GitHub queue drops)
    - cron: '25 3 * * *'
    # Evening scan around 06:00 PM IST (12:25 UTC)
    - cron: '25 12 * * *'
  # Allows you to trigger the scan manually anytime from your phone or GitHub web UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install openpyxl for Excel (.xlsx) Generation
        run: |
          pip install openpyxl

      - name: 🔍 Run ATS Scanner & Send ntfy Push Notification
        run: |
          python check_openings.py --scan --notify

      - name: 💾 Commit and Push Updated Tracker (if new jobs found)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add internships.json TRACKER.md internships.csv
          if [ -f internships.xlsx ]; then
            git add internships.xlsx
          fi
          if git diff --staged --quiet; then
            echo "No changes in tracker to commit."
          else
            git commit -m "Auto-update: New internship openings discovered [skip ci]"
            git push
          fi
